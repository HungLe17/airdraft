# Builds Airdraft on a clean Windows machine with build.ps1.
# The result is uploaded as a workflow artifact; publishing a release stays a
# separate, deliberate step.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            build/Airdraft-*-Developer-Preview-*
            build/SHA256SUMS.txt
          if-no-files-found: error

name: Bug report
description: Report a problem with Airdraft
body:
  - type: input
    id: version
    attributes:
      label: Airdraft version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include what you expected and how to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Diagnostic report
      description: Run report.cmd from the Airdraft installation folder. Review the report and logs before attaching them.
